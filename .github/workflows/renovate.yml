name: Renovate depedency check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # Run daily at 2 AM UTC

jobs:
  renovate:
    permissions:
        contents: write
        pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v43.0.16
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: DEBUG
          RENOVATE_REPOSITORIES: 'thanh-ngvt/renovate-test'
          GIT_AUTHOR_NAME: "renovate[bot]"
          GIT_COMMITTER_NAME: "renovate[bot]"
